{% extends 'learning_logs/base.html' %}

{% block page_header %}
  <h1>Add reaction</h1>
{% endblock page_header %}


{% block content %}

<form method="post">
  {% csrf_token %}

  <div class="mb-3">
    <label for="{{ form.text.id_for_label }}" class="form-label">
      Your reaction
    </label>

    {{ form.text }}
  </div>


  <button class="btn btn-primary">
    Add reaction
  </button>

</form>

{% endblock content %}
